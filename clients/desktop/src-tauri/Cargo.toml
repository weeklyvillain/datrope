[package]
name = "datrope-desktop"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "datrope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
updater = ["dep:tauri-plugin-updater", "dep:tokio"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-notification = "~2.5"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-single-instance = "~2.5"
tauri-plugin-autostart = "~2.6"
tauri-plugin-window-state = "~2.5"
tauri-plugin-opener = "~2.6"
tauri-plugin-updater = { version = "~2.13", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", features = ["json"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# Screen share: our own picker (xcap for the list and thumbnails), Windows Graphics Capture for the frames, and a
# WebView2 shared buffer to hand them to the page. webview2-com must match the version wry uses.
windows-capture = "2.0.1"
xcap = { version = "0.9.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
webview2-com = "0.39"
windows = "0.62"
