name: datrope

# The server, run as two slots (server-blue, server-green) below.
x-server: &server
  build:
    context: ../server
    args:
      DATROPE_BUILD: ${DATROPE_BUILD:-dev}
  restart: unless-stopped
  volumes:
    - files:/data
    - switch:/switch:ro
  depends_on:
    postgres:
      condition: service_healthy
    web:
      condition: service_completed_successfully # writes /switch on a fresh install

x-server-env: &server-env
  DATROPE_DATABASE_URL: postgres://datrope:${POSTGRES_PASSWORD}@postgres:5432/datrope?sslmode=disable
  DATROPE_PUBLIC_URL: https://${DATROPE_DOMAIN:?set DATROPE_DOMAIN in deploy/.env}
  DATROPE_TRUST_PROXY: "true"
  DATROPE_DATA_DIR: /data
  DATROPE_LIVEKIT_URL: http://livekit:7880
  DATROPE_LIVEKIT_API_KEY: datrope
  DATROPE_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/.env}
  DATROPE_IMGPROXY_URL: http://imgproxy:8080
  DATROPE_UPDATER_URL: http://updater:8090
  DATROPE_UPDATER_TOKEN: ${DATROPE_UPDATER_TOKEN:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datrope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: datrope
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datrope -d datrope"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Two slots of the same server; /switch/slot names the live one. An update starts the other,
  # switches Caddy to it once it is healthy, and stops the old one (deploy/README.md). The slot
  # that is not live answers health checks but runs no background jobs.
  server-blue:
    <<: *server
    environment:
      <<: *server-env
      DATROPE_SLOT: blue
  server-green:
    <<: *server
    environment:
      <<: *server-env
      DATROPE_SLOT: green

  # Copies the web app into the web volume, then exits. Caddy serves the build /switch names.
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        DATROPE_BUILD: ${DATROPE_BUILD:-dev}
    restart: "no"
    environment:
      WEB_SWITCH: "1" # a plain `up` serves this build; the updater switches it itself
    volumes:
      - web:/web
      - switch:/switch

  # Resizes stored images for the server (avatars, emoji, attachments, ...). Not reachable from outside.
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.17
    restart: unless-stopped
    user: "65532:65532" # the server's user: stored files are readable by it only
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /data/files
      IMGPROXY_ALLOWED_SOURCES: local://
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_MAX_ANIMATION_FRAMES: "256" # the server sends no GIF with more (imgproxy would drop the rest)
      IMGPROXY_MAX_ANIMATION_FRAME_RESOLUTION: "16.8" # megapixels per frame: GIFs up to 4096x4096 are shown inline
    volumes:
      - files:/data:ro

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "datrope: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"
      - "30000-30050:30000-30050/udp"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DATROPE_DOMAIN: ${DATROPE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro # a directory: git pull replaces the file, which a file mount would not see
      - switch:/switch:ro
      - web:/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_completed_successfully

  # Server settings → Updates: pulls this checkout, rebuilds and restarts the stack. It holds
  # the Docker socket, which is root on this machine, so it publishes no ports and answers only
  # requests with the token (only the server has it). Without DATROPE_UPDATER_TOKEN it idles.
  updater:
    build:
      context: ..
      dockerfile: deploy/updater.Dockerfile
    restart: unless-stopped
    environment:
      DATROPE_UPDATER_TOKEN: ${DATROPE_UPDATER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/repo
      - updater:/state
      - switch:/switch

volumes:
  postgres:
  files:
  caddy_data:
  caddy_config:
  updater:
  switch:
  web:
