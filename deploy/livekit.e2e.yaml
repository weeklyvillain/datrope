# End-to-end test variant of livekit.yaml: advertise 127.0.0.1 instead of
# the public IP (NODE_IP is set in docker-compose.e2e.yml).
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
room:
  empty_timeout: 300
  departure_timeout: 20
webhook:
  api_key: datrope
  urls:
    - http://caddy:8081/api/voice/webhook
logging:
  level: info
